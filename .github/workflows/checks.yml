name: Checks

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Translations (Malay, Chinese, Burmese)
        run: node scripts/i18n-check.mjs .
      - name: Tests
        run: npm test --if-present
        env:
          CI: 'true'
      - name: Build
        run: npm run build
